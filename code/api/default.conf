server {
    listen 8080;

    # Catch-all: answer 200 on every path so health checks and smoke
    # tests (/, /healthz, /anything) all succeed.
    location / {
        default_type text/plain;
        return 200 "FondueTracker placeholder is up.\nmethod: $request_method\nuri: $uri\nhost: $host\n";
    }
}
